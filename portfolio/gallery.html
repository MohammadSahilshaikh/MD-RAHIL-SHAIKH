<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Md Rahil Shaikh</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navMount"></div>

<header class="section blueprint-bg section-dark" style="padding:70px 0 50px;">
  <div class="container reveal">
    <span class="eyebrow">Site Visits & Work</span>
    <h1 style="font-size:clamp(2rem,4vw,3rem); color:var(--white);">Gallery</h1>
    <p style="color:var(--concrete-dark); margin-top:10px;">Kisi bhi image par click karke bada dekhein.</p>
  </div>
</header>

<section class="section section-light">
  <div class="container">
    <div class="gallery-grid" id="galleryMount"></div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <div class="lightbox-content">
    <img id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>
</div>

<div id="footMount"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const data = injectLayout();
  const mount = document.getElementById("galleryMount");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxCaption = document.getElementById("lightboxCaption");

  data.gallery.forEach((item) => {
    const div = document.createElement("div");
    div.className = "gallery-item reveal";
    div.innerHTML = item.img
      ? `<img src="${item.img}" alt="${item.title}"><div class="gallery-caption">${item.title}</div>`
      : `<div class="gallery-placeholder">📷 ${item.title}</div><div class="gallery-caption">${item.title}</div>`;

    div.addEventListener("click", () => {
      if (!item.img) return;
      lightboxImg.src = item.img;
      lightboxCaption.textContent = item.title;
      lightbox.classList.add("open");
    });
    mount.appendChild(div);
  });

  if (data.gallery.length === 0) {
    mount.innerHTML = `<p style="color:var(--steel-light)">Abhi tak koi image add nahi hui. Admin panel se add karein.</p>`;
  }

  document.getElementById("lightboxClose").addEventListener("click", () => {
    lightbox.classList.remove("open");
  });
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) lightbox.classList.remove("open");
  });
</script>
</body>
</html>
